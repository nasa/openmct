# CodeRabbit configuration for Open MCT.
# Schema: https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit reviews pull requests and runs the pre-merge checks below. Its approval
# is one of the two that master's branch protection requires, alongside a
# maintainer's, and the contribution gate reads it to decide when to ask the team.
#
# With auto_approvals on, CodeRabbit requests changes when a check in "error" mode
# fails, or for any blocking review comment, and approves once neither is left.
# A failing "warning" check does not stop it approving, so every check that must
# hold a pull request back is in error mode.
#
# This file is read from the branch a pull request targets, never from the pull
# request itself, so a pull request cannot change its own review. A change here
# reaches an open pull request at that pull request's next push.
#
# Contributors write their own pull request titles and descriptions, so nothing here
# lets CodeRabbit write either one, or commit to a contributor's branch.

language: en-US
tone_instructions: >-
  Be direct and specific. Write for a contributor who may be new to Open MCT: name the
  file and line, say what is wrong and why, and point to the relevant project document.

chat:
  auto_reply: true

knowledge_base:
  code_guidelines:
    enabled: true
    # AGENTS.md and CLAUDE.md are read by default. These are the documents they point to.
    filePatterns:
      - CONTRIBUTING.md
      - docs/src/process/common-coding-pitfalls.md
      - TESTING.md
      - files: e2e/README.md
        applyTo: e2e/**
      - files: API.md
        applyTo: src/api/**
  learnings:
    scope: local

reviews:
  profile: chill

  # Never write the title or description for the author. Each feature is switched
  # on by a keyword in the title or description, so each keyword is set to a string
  # nobody will type by accident.
  high_level_summary: false
  high_level_summary_placeholder: '@coderabbitai summary disabled-for-openmct'
  auto_title_placeholder: '@coderabbitai title disabled-for-openmct'

  poem: false
  in_progress_fortune: false
  sequence_diagrams: false
  collapse_walkthrough: true
  changed_files_summary: true
  assess_linked_issues: true
  estimate_code_review_effort: true

  # The contribution gate owns labels and reviewer requests.
  suggested_labels: false
  auto_apply_labels: false
  suggested_reviewers: false
  auto_assign_reviewers: false

  review_status: true
  commit_status: true
  fail_commit_status: false
  abort_on_close: true

  # Approve once every error-mode pre-merge check passes and CodeRabbit's review
  # threads are resolved; request changes when a check fails or a review comment
  # blocks.
  auto_approvals:
    enabled: true

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    # The default pauses automatic reviews after five reviewed commits, which
    # would leave later pushes without a review, and so without an approval.
    auto_pause_after_reviewed_commits: 0

  # Anything that would commit to the author's branch or open pull requests on its own.
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    simplify:
      enabled: false
    autofix:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false

  path_instructions:
    - path: '**/*'
      instructions: >-
        Do not comment on formatting, style or spelling: ESLint, Prettier and cspell
        already run in CI. Spend review effort on correctness, API compatibility for
        third-party plugin authors, test coverage of the changed code path, and the
        conventions in CONTRIBUTING.md and common-coding-pitfalls.md.
    - path: 'src/api/**'
      instructions: >-
        Code under src/api is the public plugin-authoring API documented in API.md.
        Flag any change to an exported signature, event, or documented behaviour that
        would break an existing third-party plugin, and say whether API.md was updated
        to match.
    - path: 'e2e/**'
      instructions: >-
        Check new and changed tests against e2e/README.md, in particular its guidance on
        fixtures, selectors, and avoiding pixel snapshot tests.

  pre_merge_checks:
    # The author cannot override a failing check; only a requested reviewer can.
    override_requested_reviewers_only: true

    # Judged inconsistently in testing: it passed titles its own explanation said were wrong.
    title:
      mode: 'off'
    # Replaced by the more specific custom checks below.
    description:
      mode: 'off'
    issue_assessment:
      mode: warning

    custom_checks:
      # Why a change is needed belongs on its issue, not its pull request. Testing
      # instructions belong there too, but the contribution gate checks for those
      # itself, because it also accepts them in a comment on the issue, which
      # CodeRabbit does not read.
      - name: Issue explains why
        mode: error
        instructions: >-
          Read the issue this pull request closes or addresses. Judge that issue's
          description, not the pull request's: the pull request does not need to
          explain why. Pass if the issue's description states the problem to be solved
          or the reason for the change, in terms of Open MCT's behaviour or its users,
          and not only what code should be edited. Fail if it only names files,
          functions or code changes to make, or is empty. Pass if no issue is linked,
          because another check requires one. When failing, quote the issue text that
          falls short.

      - name: Changed code is tested
        mode: error
        instructions: >-
          Pass if the diff adds or changes a test that exercises the changed behaviour.
          Open MCT prefers Playwright end-to-end tests under e2e/ for new work; a
          Jasmine spec (*Spec.js) also passes. Also pass if the diff only touches
          documentation, configuration or tests, or if the description explains why the
          change cannot be tested. Fail otherwise, and name the changed behaviour that
          no test covers.

      # The built-in issue assessment already checks for changes outside the issue's
      # scope. This adds the one rule it lacks: a bug fix needs no maintainer approval,
      # so a feature must not arrive labelled as one.
      - name: A bug fix adds no features
        mode: error
        instructions: >-
          Read the issue this pull request closes or addresses. If that issue has the
          type:bug label, fail if the diff adds new user-facing functionality,
          configuration options, or public API (anything under src/api/ or documented
          in API.md) instead of correcting existing behaviour. When failing, quote the
          issue text and name the functionality that was added. Pass in every other
          case, including when no issue is linked or the issue is not type:bug.
