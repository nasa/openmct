name: Gate Token Spike (throwaway)

# Answers the three questions we could not answer without trying them against a
# real pull request in this repository:
#
#   1. Can GITHUB_TOKEN request Copilot as a reviewer?
#   2. Can it request an organization team as a reviewer?
#   3. Can it resolve a review thread through the GraphQL API?
#
# Every probe is verified by READING BACK the result, never by trusting the HTTP
# status. The review-request endpoint returns 200 and silently discards reviewers
# it will not accept, so a status code proves nothing. That silent drop is exactly
# what we are hunting for, and it gets its own answer: "Accepted but ignored".
#
# By default the workflow puts the pull request back as it found it: anything it
# actually managed to change is undone.
#
# DELETE THIS FILE once the answers are recorded in
# .github/scripts/contribution-gate/README.md. It exists only to de-risk the
# contribution gate, and it has permission to write to pull requests.

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: 'Pull request number to probe against'
        required: true
        default: '8452'
        type: string
      leave_changes_in_place:
        description: 'Keep the review requests and the resolved thread instead of undoing them'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: write

jobs:
  probe:
    name: probe
    runs-on: ubuntu-latest
    steps:
      - name: Try the three uncertain calls
        uses: actions/github-script@v7
        env:
          PULL_REQUEST_NUMBER: ${{ inputs.pull_request }}
          LEAVE_CHANGES_IN_PLACE: ${{ inputs.leave_changes_in_place }}
        with:
          script: |
            // Copilot has two identities. This is the one you REQUEST. The review
            // it posts is authored by 'copilot-pull-request-reviewer[bot]', which
            // is what to look for when detecting that a review has arrived.
            const COPILOT_REVIEWER_LOGIN = 'Copilot';
            const COPILOT_AUTHOR_LOGIN = 'copilot-pull-request-reviewer[bot]';
            const REVIEWER_TEAM_SLUG = 'openmct-maintainers';

            const ANSWERS = {
              worked: 'Worked',
              refused: 'Refused',
              ignored: 'Accepted but ignored',
              notAttempted: 'Not attempted'
            };

            const pullNumber = Number.parseInt(process.env.PULL_REQUEST_NUMBER, 10);
            const undoChanges = process.env.LEAVE_CHANGES_IN_PLACE !== 'true';
            const { owner, repo } = context.repo;
            const results = [];

            await probeCopilotReviewRequest();
            await probeTeamReviewRequest();
            await probeThreadResolution();
            await reportResults();

            async function probeCopilotReviewRequest() {
              const probe = `Request "${COPILOT_REVIEWER_LOGIN}" as a reviewer`;
              const outcome = await call(() =>
                github.rest.pulls.requestReviewers({
                  owner,
                  repo,
                  pull_number: pullNumber,
                  reviewers: [COPILOT_REVIEWER_LOGIN]
                })
              );

              if (outcome.ok === false) {
                record(probe, ANSWERS.refused, outcome.detail);

                return;
              }

              const requested = await readRequestedReviewers();

              if (includesCopilot(requested.users) === false) {
                record(
                  probe,
                  ANSWERS.ignored,
                  `The API returned success, but Copilot is not on the reviewer list afterwards (it holds: ${describeList(requested.users)}). ` +
                    'That means Copilot code review is not available to this repository, which is an organization policy or billing question, not a token one.'
                );

                return;
              }

              record(probe, ANSWERS.worked, 'Copilot is on the reviewer list.');

              if (undoChanges) {
                await undo('Withdraw the Copilot request', () =>
                  github.rest.pulls.removeRequestedReviewers({
                    owner,
                    repo,
                    pull_number: pullNumber,
                    reviewers: [COPILOT_REVIEWER_LOGIN]
                  })
                );
              }
            }

            async function probeTeamReviewRequest() {
              const probe = `Request review from @${owner}/${REVIEWER_TEAM_SLUG}`;
              const outcome = await call(() =>
                github.rest.pulls.requestReviewers({
                  owner,
                  repo,
                  pull_number: pullNumber,
                  team_reviewers: [REVIEWER_TEAM_SLUG]
                })
              );

              if (outcome.ok === false) {
                record(probe, ANSWERS.refused, outcome.detail);

                return;
              }

              const requested = await readRequestedReviewers();

              if (requested.teams.includes(REVIEWER_TEAM_SLUG) === false) {
                record(
                  probe,
                  ANSWERS.ignored,
                  `The API returned success, but the team is not on the reviewer list afterwards (it holds: ${describeList(requested.teams)}). ` +
                    'Check that the team exists and has access to this repository.'
                );

                return;
              }

              record(probe, ANSWERS.worked, 'The team is on the reviewer list.');

              if (undoChanges) {
                await undo('Withdraw the team request', () =>
                  github.rest.pulls.removeRequestedReviewers({
                    owner,
                    repo,
                    pull_number: pullNumber,
                    team_reviewers: [REVIEWER_TEAM_SLUG]
                  })
                );
              }
            }

            async function probeThreadResolution() {
              const thread = await findAThreadToResolve();

              if (thread === undefined) {
                record(
                  'Resolve a review thread',
                  ANSWERS.notAttempted,
                  'This pull request has no review threads to practise on.'
                );

                return;
              }

              const probe = `Resolve review thread on ${thread.path}`;
              const outcome = await call(() =>
                github.graphql(
                  `mutation($threadId: ID!) { resolveReviewThread(input: { threadId: $threadId }) { thread { id isResolved } } }`,
                  { threadId: thread.id }
                )
              );

              if (outcome.ok === false) {
                record(probe, ANSWERS.refused, outcome.detail);

                return;
              }

              const isResolvedNow = await readThreadResolution(thread.id);

              if (isResolvedNow === false) {
                record(probe, ANSWERS.ignored, 'The mutation succeeded, but the thread is still unresolved.');

                return;
              }

              record(probe, ANSWERS.worked, 'The thread is resolved.');

              if (undoChanges && thread.isResolved === false) {
                await undo('Unresolve it again', () =>
                  github.graphql(
                    `mutation($threadId: ID!) { unresolveReviewThread(input: { threadId: $threadId }) { thread { id isResolved } } }`,
                    { threadId: thread.id }
                  )
                );
              }
            }

            async function readRequestedReviewers() {
              const { data } = await github.rest.pulls.listRequestedReviewers({
                owner,
                repo,
                pull_number: pullNumber
              });

              return {
                users: data.users.map((user) => user.login),
                teams: data.teams.map((team) => team.slug)
              };
            }

            async function readThreadResolution(threadId) {
              const response = await github.graphql(
                `query($threadId: ID!) { node(id: $threadId) { ... on PullRequestReviewThread { isResolved } } }`,
                { threadId }
              );

              return response.node.isResolved;
            }

            async function findAThreadToResolve() {
              const response = await github.graphql(
                `query($owner: String!, $repo: String!, $number: Int!) {
                   repository(owner: $owner, name: $repo) {
                     pullRequest(number: $number) {
                       reviewThreads(first: 20) {
                         nodes { id isResolved path comments(first: 1) { nodes { author { login } } } }
                       }
                     }
                   }
                 }`,
                { owner, repo, number: pullNumber }
              );
              const threads = response.repository.pullRequest.reviewThreads.nodes;

              core.info(`Found ${threads.length} review thread(s) on #${pullNumber}.`);
              threads.forEach((thread) => {
                core.info(`  ${thread.id} resolved=${thread.isResolved} path=${thread.path} author=${readFirstAuthor(thread)}`);
              });

              return threads.find((thread) => thread.isResolved === false) ?? threads[0];
            }

            function readFirstAuthor(thread) {
              const firstComment = thread.comments.nodes[0];

              if (firstComment === undefined || firstComment.author === null) {
                return 'unknown';
              }

              return firstComment.author.login;
            }

            /** Copilot may appear under either of its two identities. */
            function includesCopilot(logins) {
              const wanted = [COPILOT_REVIEWER_LOGIN.toLowerCase(), COPILOT_AUTHOR_LOGIN.toLowerCase()];

              return logins.some((login) => wanted.includes(login.toLowerCase()));
            }

            function describeList(values) {
              if (values.length === 0) {
                return 'nothing';
              }

              return values.join(', ');
            }

            async function call(apiCall) {
              try {
                await apiCall();

                return { ok: true };
              } catch (error) {
                return { ok: false, detail: `${error.status ?? ''} ${error.message}`.trim() };
              }
            }

            async function undo(description, apiCall) {
              const outcome = await call(apiCall);

              if (outcome.ok) {
                core.info(`Undone: ${description}`);

                return;
              }

              core.warning(`Could not undo (${description}): ${outcome.detail}`);
            }

            function record(probe, answer, detail) {
              const logLine = `${answer}: ${probe} — ${detail}`;

              if (answer === ANSWERS.worked) {
                core.info(logLine);
              } else {
                core.warning(logLine);
              }

              results.push({ probe, answer, detail });
            }

            async function reportResults() {
              const rows = results.map((result) => [result.probe, result.answer, result.detail]);

              await core.summary
                .addHeading(`Contribution gate token probe against #${pullNumber}`)
                .addTable([
                  [
                    { data: 'Probe', header: true },
                    { data: 'Answer', header: true },
                    { data: 'What it means', header: true }
                  ],
                  ...rows
                ])
                .addRaw(
                  undoChanges
                    ? 'Anything that actually changed was put back.'
                    : 'Changes were left in place, as requested.'
                )
                .write();
            }
