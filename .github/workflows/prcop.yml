name: PRCop

on:
  pull_request:
    types:
      - labeled
      - unlabeled
      - opened
      - reopened
      - synchronize
      - edited
  pull_request_review_comment:
    types:
      - created
jobs:
  prcop:
    runs-on: ubuntu-latest
    name: Template Check
    steps:
      - name: Linting Pull Request
        uses: makaroni4/prcop@v1.0.35
        with:
          config-file: '.github/workflows/prcop-config.json'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
